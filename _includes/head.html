{%- comment -%} Based on the just-the-docs 0.12 head.html, with light and dark
color schemes selected by prefers-color-scheme. {%- endcomment -%}

<head>
  <meta charset="UTF-8" />

  <link
    rel="stylesheet"
    href="{{ '/assets/css/just-the-docs-skhep.css' | relative_url }}"
    media="not (prefers-color-scheme: dark)"
  />
  <link
    rel="stylesheet"
    href="{{ '/assets/css/just-the-docs-darkskhep.css' | relative_url }}"
    media="(prefers-color-scheme: dark)"
  />

  <link
    rel="stylesheet"
    href="{{ '/assets/css/just-the-docs-head-nav.css' | relative_url }}"
    id="jtd-head-nav-stylesheet"
  />

  <style id="jtd-nav-activation">
    {% include css/activation.scss.liquid %}
  </style>

  {% if site.search_enabled != false %}
  <script src="{{ '/assets/js/vendor/lunr.min.js' | relative_url }}"></script>
  {% endif %}

  <script src="{{ '/assets/js/just-the-docs.js' | relative_url }}"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  {% include_cached favicon.html %} {% seo %} {% include head_custom.html %}
</head>
